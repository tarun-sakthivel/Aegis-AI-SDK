[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-sre"
version = "0.1.0"
description = "Autonomous Incident Response and Self-Healing SDK for FastAPI/Python applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["sre", "incident-response", "self-healing", "langgraph", "fastapi", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: System :: Monitoring",
]

dependencies = [
    # Core LLM orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",

    # Retrieval
    "rank-bm25>=0.2.2",
    "pgvector>=0.3.0",
    "psycopg[async]>=3.1.0",
    "langchain-postgres>=0.0.9",

    # Schema & validation
    "pydantic>=2.7.0",

    # ASGI / web framework integration
    "starlette>=0.37.0",
    "fastapi>=0.111.0",

    # Async HTTP (MCP fallback notifications)
    "httpx>=0.27.0",

    # Utilities
    "typing-extensions>=4.12.0",

    # In-process service topology (blast radius)
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",        # AsyncClient for ASGI testing
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
openai = ["langchain-openai>=0.2.0", "openai>=1.30.0"]
google = ["langchain-google-genai>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["sentinel_sre"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
